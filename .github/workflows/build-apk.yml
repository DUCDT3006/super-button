name: Build & Release Super Button APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SuperButton-v1.0.0.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SuperButton-APK
          path: SuperButton-v1.0.0.apk

      - name: Create GitHub Release & Publish APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build${{ github.run_number }}
          name: Super Button v1.0.0 (Tải file APK cài đặt)
          body: |
            ### 📱 Super Button - Nút Nguồn Ảo Cho Samsung Galaxy Note 20
            
            #### 📥 Tải ứng dụng:
            Tải trực tiếp file **`SuperButton-v1.0.0.apk`** đính kèm bên dưới và mở cài đặt trên Samsung Note 20.

            #### ✨ Tính năng nổi bật trong bản này:
            - **Thay thế nút nguồn vật lý**: Khóa màn hình (giữ vân tay bình thường), Mở bảng tắt nguồn/Restart, Chụp màn hình.
            - **Di chuyển linh hoạt 360°**: Kéo thả tự do, tự động hút dính mép màn hình (Snap to Edge) và tự lưu tọa độ vị trí.
            - **Độ trong suốt mờ nhám (Frosted Glass)**: Tùy chỉnh độ mờ (Opacity 10% - 100%) và tự làm mờ sâu khi không chạm (Auto-fade).
            - **Menu tròn đa năng**: Phím tắt Nguồn, Khóa, Âm lượng, Ảnh chụp, Thông báo, Home.
          files: SuperButton-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
